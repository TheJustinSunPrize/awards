name = "jsp331"
version = "0.1.0"
defaultTargets = ["JSP331"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "JSP331"

[[lean_lib]]
name = "ErdosProblems"
srcDir = ".lake/upstream/proof"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = ".lake/upstream/proof"

[[lean_lib]]
name = "BoundedGaps"
srcDir = ".lake/upstream/FormalPantheon/BoundedGaps"
