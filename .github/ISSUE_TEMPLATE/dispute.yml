name: Formal dispute
description: The formal entry point for disputes about announced awards.
title: "[Dispute] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to raise a concern about an announced award. Include public evidence and relevant dates. Maintainers will record the concern and arrange review; this form does not establish an appeals deadline or procedure.
        Submit public evidence only; do not publish private identity or payment information.
  - type: input
    id: award
    attributes:
      label: Award and announcement
    validations:
      required: true
  - type: input
    id: timing
    attributes:
      label: Relevant dates
      description: Give the announcement date and the dates of the relevant evidence.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Disputed claim
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and requested resolution
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Conflicts and reviewer recusal
    validations:
      required: true
