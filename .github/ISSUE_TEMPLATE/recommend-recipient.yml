name: Recommend a recipient
description: Recommend evidenced contributions without prematurely publishing an identity.
title: "[Recipient] "
body:
  - type: markdown
    attributes:
      value: |
        Use RECIPIENT-<ENTRY>-A placeholders before written confirmation. Do not put unconfirmed names in the title, body, attachments, or commits. Do not submit private contact details, original confirmation documents, or payment information.
  - type: input
    id: entry
    attributes:
      label: Related problem or entry
    validations:
      required: true
  - type: input
    id: recipient
    attributes:
      label: Recipient placeholder or confirmed public ID
    validations:
      required: true
  - type: textarea
    id: contributions
    attributes:
      label: Contributions and evidence
      description: Distinguish the proof, formalization, operation, exposition and independent contributions. Use public evidence that does not expose an unconfirmed identity.
    validations:
      required: true
  - type: textarea
    id: confirmation
    attributes:
      label: Confirmation status
      description: State whether written confirmation exists; link only an authorized public attestation. Otherwise write pending.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Attribution questions and conflicts
    validations:
      required: true
