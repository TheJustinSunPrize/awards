name: Correction
description: Correct a public record or document with evidence.
title: "[Correction] "
body:
  - type: markdown
    attributes:
      value: |
        The curatorial committee provisionally handles corrections. Substantive changes require committee confirmation. Do not repeat private information.
  - type: input
    id: target
    attributes:
      label: Record or document
      description: Link the exact file or section.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Current text and proposed correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and affected records
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Relevant conflicts
      description: State relevant public professional relationships, or write none.
    validations:
      required: true
