name: JSP-000400 Lean
on:
  push:
    paths:
      - 'proofs/jsp-000400/**'
      - '.github/workflows/jsp-000400-lean.yml'
  pull_request:
    paths:
      - 'proofs/jsp-000400/**'
      - '.github/workflows/jsp-000400-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: true
          leanchecker: true
          use-github-cache: false
          lake-package-directory: proofs/jsp-000400
      - name: Audit theorem axioms and fixed source
        working-directory: proofs/jsp-000400
        run: python3 verify.py
