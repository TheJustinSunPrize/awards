name: Bourque-Ligh Lean proof

on:
  push:
    paths:
      - 'submissions/bourque-ligh-counterexample/**'
      - '.github/workflows/bourque-ligh-proof.yml'
  pull_request:
    paths:
      - 'submissions/bourque-ligh-counterexample/**'
      - '.github/workflows/bourque-ligh-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: submissions/bourque-ligh-counterexample
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build, replay and audit the three final theorems
        working-directory: submissions/bourque-ligh-counterexample
        run: python3 verify.py
      - name: Upload proof verification logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bourque-ligh-verification
          path: submissions/bourque-ligh-counterexample/verification/local/
          if-no-files-found: error
