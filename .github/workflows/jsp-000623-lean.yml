name: JSP-000623 Lean

on:
  push:
    paths:
      - 'proofs/jsp-000623/**'
      - '.github/workflows/jsp-000623-lean.yml'
  pull_request:
    paths:
      - 'proofs/jsp-000623/**'
      - '.github/workflows/jsp-000623-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: proofs/jsp-000623
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Verify the committed proof in a fresh checkout
        working-directory: proofs/jsp-000623
        run: python3 verify.py --verify
      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-000623-verification
          path: proofs/jsp-000623/verification/full/
          if-no-files-found: error
