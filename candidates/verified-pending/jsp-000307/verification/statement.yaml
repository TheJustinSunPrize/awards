statement:
  text: "Jsp307.JSP_307 : the largest prime factors of the consecutive integers 13, 14, 15 are strictly decreasing: P(13) = 13 > P(14) = 7 > P(15) = 5 (where P(n) is the largest prime factor of n). Equivalently, n = 13 satisfies P(n) > P(n+1) > P(n+2)."
  natural_language_source: "Do there exist consecutive integers whose largest prime factors are strictly decreasing? (catalog JSP-000307). Witness-based proof: n=13 gives P(13)=13 > P(14)=7 > P(15)=5."
  definitions_reviewed:
    - name: "Nat.Prime"
      from_library: true
      review: "Standard mathlib definition of primality."
    - name: "IsLPF"
      from_library: false
      review: "Defined in Jsp307.lean: p is the largest prime factor of n iff p.Prime ∧ p ∣ n ∧ ∀ q, q.Prime → q ∣ n → q ≤ p. The maximality property follows from `prime_dvd_le`."
