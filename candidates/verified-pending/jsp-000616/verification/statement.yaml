statement:
  text: "The number of sum-free subsets of {1,...,n} equals an exact finite value for small n (c(1)=2, c(2)=3, c(3)=6, c(4)=9, c(5)=16, c(6)=24, c(7)=42), where a subset is sum-free if no element equals a sum of two (possibly equal) members."
  natural_language_source: "Counting sum-free subsets of integer intervals (catalog 000616; catalog JSP-000616)"
