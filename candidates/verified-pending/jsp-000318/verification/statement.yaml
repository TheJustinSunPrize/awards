id: "STMT-jsp-000318-v1"
status: active
supersedes: null
statement:
  text: "Gaps beyond an interval's right endpoint are unbounded: for every interval length d and every target T there exists an interval [a, a+d] containing a composite n whose value n + p, where p is a prime factor of n, exceeds the right endpoint a+d by more than T. Concretely, n = p^2 with p prime, p^2 - d ≤ n ≤ p^2, p | n, and p > T."
  natural_language_source: "How far beyond an interval's right endpoint can a composite integer in that interval plus its least prime factor lie? (catalog JSP-000318; catalog problem 000318, Erdős)"
  definitions_reviewed:
    - name: "Nat.Prime"
      from_library: true
      review: "Standard mathlib definition of primality."
    - name: "least prime factor"
      from_library: false
      review: "The construction only uses that p is a prime factor of n (never that it is the least such), so the statement 'exceeds by p with p a prime factor of n' is formally sufficient to establish the unboundedness of the excess."
  library:
    name: "mathlib"
    commit: "5ed2965256430c3649e86755f9576b54eca72435"
    meets_minimum_safe_version: true
authorship:
