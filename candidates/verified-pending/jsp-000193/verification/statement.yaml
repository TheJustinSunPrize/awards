statement:
  text: "There exists a positive integer N such that for every i in {1,2,3,4,5,6,7,8}, the integer N+i is not squarefree, i.e. the gap between consecutive squarefree integers is at least 9. Witness N = 65335225716547, with p_i^2 dividing N+i for the primes p = (2,3,5,7,11,13,17,19)."
  natural_language_source: "Gaps between consecutive squarefree integers (catalog JSP-000193; catalog problem 000193, Erdős)"
  definitions_reviewed:
    - name: "Squarefree"
      from_library: true
      review: "Standard mathlib definition (root-namespace Squarefree via natFactorization / prime-square obstruction)."
    - name: "Nat.Prime"
      from_library: true
      review: "Standard mathlib definition of primality."
