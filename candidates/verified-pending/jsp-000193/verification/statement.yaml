id: "STMT-jsp-000193-v1"
status: active
supersedes: null
statement:
  text: "Gaps between consecutive squarefree integers are unbounded: for every n ≥ 1 there exist n consecutive positive integers, none of which is squarefree. Equivalently, ∀ n ≥ 1, ∃ N, ∀ i with 1 ≤ i ≤ n, N+i is not squarefree."
  natural_language_source: "Gaps between consecutive squarefree integers (catalog JSP-000193; catalog problem 000193, Erdős). Complete solution: the gaps are unbounded, via the Chinese Remainder Theorem."
  definitions_reviewed:
    - name: "Squarefree"
      from_library: true
      review: "Standard mathlib definition (root-namespace Squarefree; a number is squarefree iff no prime square divides it, Nat.squarefree_iff_prime_squarefree)."
    - name: "Nat.Prime"
      from_library: true
      review: "Standard mathlib definition of primality."
  library:
    name: "mathlib"
    commit: "5ed2965256430c3649e86755f9576b54eca72435"
    meets_minimum_safe_version: true
