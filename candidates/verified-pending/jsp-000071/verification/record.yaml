  basis: "The informal problem (Erdos problems list, problem 43; candidates/verified-pending/jsp-000071/verification/statement.yaml) asks how large two Sidon-type sets (pairwise-distinct two-element sums) can be in total when their nonzero difference sets are disjoint. The formalized theorem not_erdos_43 denies the existence of a universal constant C bounding the total quadratic-pair count C(|A|,2)+C(|B|,2) by C(f N,2)+C for all sufficiently large N; both Sidon conditions are captured by IsSidon A / IsSidon B, disjointness of common nonzero differences by (A - A) ∩ (B - B) = {0}."
