  natural_language_source: "How large can two sets with distinct two-element sums be in total if their nonzero difference sets are disjoint? (Erdos problems list, problem 43; problems/catalog-0001-0100.md, entry JSP-000071; https://www.erdosproblems.com/43). The formal statement denies the existence of a universal constant C making the quadratic-pair count of two disjoint-difference Sidon sets bounded by the Sidon-maximum pair count of an initial segment plus C, for all sufficiently large N."
