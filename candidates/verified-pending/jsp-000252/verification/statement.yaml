id: "STMT-jsp-000252-v2"
status: active
supersedes: "STMT-jsp-000252-v1"
statement:
  text: "JSP252.main_bound : ∃ N₀ : ℕ, ∀ n : ℕ, N₀ ≤ n → ((JSP252.subOneSubsets n).card : ℝ) ≤ (2 : ℝ) ^ (0.93 * (n : ℝ))"
  natural_language_source: "catalog 000252: 'Subsets of a finite integer range with reciprocal sum one'. [St24] S. Steinerberger, On a problem involving unit fractions, arXiv:2403.17041 (2024), main theorem: for all sufficiently large n, #{S ⊆ {1,…,n} : Σ_{s∈S} 1/s ≤ 1} < 2^(0.93·n). The formalized statement is the non-strict upper bound for all n ≥ N₀ (implied by the paper's strict bound); N₀ = 200000 is chosen in the proof."
  definitions_reviewed:
    - name: "JSP252.subOneSubsets"
      from_library: false
      review: "Subsets S of {1,…,n} with Σ_{s∈S} 1/s ≤ 1; matches the paper's counting set."
    - name: "harmonicR"
      from_library: false
      review: "Real harmonic numbers Σ_{k=1}^{m} 1/k; matches mathlib conventions and paper usage."
    - name: "Nat.floor"
      from_library: true
      review: "Standard mathlib definition of floor; used to set m = ⌊c0·n⌋ with c0 = 0.0384235."
  library:
    name: "mathlib"
    commit: "09a9e06e4e5ccd5b783f25e52ad3ebecfb1e2d68"
    meets_minimum_safe_version: true
authorship:
  signatories:
    - "jsp252-verifier"
    - "shiqiang-chen"
  issued_at: "2026-09-18"
