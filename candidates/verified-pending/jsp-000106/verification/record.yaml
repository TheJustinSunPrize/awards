  note_en: "Independent verification of the pinned upstream commit at Lean v4.34.0 / mathlib v4.34.0. All 32 Lean files of the closure (22 Erdos90b + 10 PrimeNumberTheoremAnd) compile exit=0 in import order on the current-release toolchain (established across the driver runs of 2026-09-19 02:24/02:32/02:43; each step has an exit=0 compile) after applying 8 documented porting fixes required by the mathlib 4.33->4.34 API drift (see PORTING-DIFF-106.md and the byte-level pinned-vs-verified diff between hashes-pinned-src.tsv and hashes-final.tsv): Sobolev.lean 308-309 (ring_nf), Wiener.lean 2827 (binder ascription (sigma' : ℝ)), Consequences.lean 4 sites (sqrt_eq_rpow/div_sqrt rewrites, ext+ring, dropped stale bullets, exponent-sum equality via Finset.sum_congr + Nat.primeFactorsList_count_eq), TauCeti IdealCount/Basic + ErdosUnitDistance NormFibre + PointCount (+ import Mathlib.Algebra.CharZero.Infinite; mathlib 4.34 added an [Infinite S] hypothesis to Ideal.absNorm), MultiquadraticField.lean 41 (Complex.isIntegral_I ℚ), Discriminant.lean 296/314 and PointCount.lean 153 (Finset.prod_le_prod -> Finset.prod_le_prod₀; mathlib 4.34 made prod_le_prod the single-hypothesis [MulLeftMono] variant, the ordered-ring two-hypothesis form is prod_le_prod₀). The final raw driver run (02:43:50 -> 02:49:56, log embedded in current-release-v4.34.log) had 29/32 steps exit=0: three single-file steps (PNT-Sobolev, PNT-Wiener, EUD-PrimesMod4) were terminated mid-compile by external host-level interference (TerminateProcess by an unrelated parallel workload on the shared host; observed at 02:43:58/02:44:59/02:46:57); each of those three steps compiled exit=0 in the immediately preceding driver runs of the same session (Sobolev 02:32:37, Wiener 02:33:22, PrimesMod4 02:35:09), and their byte-consistent .olean files were loaded by all downstream steps, which passed. Module layout mirrors upstream (ErdosProblems.Erdos90b + ErdosProblems.Erdos90b/External/{ErdosUnitDistance,TauCeti} + PrimeNumberTheoremAnd). Axiom audit via #print axioms on both entry declarations (Audit90b.lean, exit=0 in every run) reports exactly [propext, Classical.choice, Quot.sound]; no sorryAx, no user axioms, no unsafe declarations (grep over the 33 source files: zero occurrences of sorry)."
