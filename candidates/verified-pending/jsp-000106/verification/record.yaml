statement_comparison:
  statement_id: "STMT-jsp-000106-v1"
  theorem_name: "Erdos90b.not_erdos_90"
  result: equivalent
  basis: "The informal problem (Erdos problems list, problem 90(b); candidates/verified-pending/jsp-000106/verification/statement.yaml; https://www.erdosproblems.com/90) asks how many unit-distance pairs n points in the Euclidean plane can determine, and whether the uniform bound u(n) < n^(1 + C/log(log n)) holds for some absolute constant C. The formalized theorem not_erdos_90 states exactly the negation of every such bound: for every C : ℝ with 0 < C and every N : ℕ, there exist n ≥ N and a Finset Point P (Point = EuclideanSpace ℝ (Fin 2)) with P.card = n and (n : ℝ)^(1 + C / Real.log (Real.log n)) < (unitDistancePairs P : ℝ), where unitDistancePairs P = Erdos.unitDist P counts the unordered pairs of distinct points of P at distance one. The companion declaration Erdos90b.erdos_90b is an alias of the same theorem. The formal statement directly matches the requested answer (the proposed uniform bound is false; arbitrarily many unit distances occur)."
  performed_by: "jsp106-verifier"
  performed_at: "2026-09-18"
