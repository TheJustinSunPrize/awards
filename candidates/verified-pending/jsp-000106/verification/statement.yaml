id: "STMT-jsp-000106-v1"
status: active
supersedes: null
statement:
  text: "Erdos90b.not_erdos_90 : ∀ C : ℝ, 0 < C → ∀ N : ℕ, ∃ (n : ℕ) (P : Finset Point), N ≤ n ∧ P.card = n ∧ (n : ℝ) ^ (1 + C / Real.log (Real.log n)) < (unitDistancePairs P : ℝ)"
  natural_language_source: "Erdos problems list, problem 90 — how many unit distances can be determined by n points in the plane? (https://www.erdosproblems.com/90; historical bounty $500 for part (b)). Let u(n) denote the maximum number of unit-distance pairs among n points in the Euclidean plane. The proposed uniform upper bound u(n) < n^(1 + C/log(log n)) for some absolute constant C (the form implicit in the problem's part (b)) is false: L. Alpöge's construction disproves every such bound. The formal statement not_erdos_90 quantifies this: for every positive constant C and every cardinality threshold N, there is a planar configuration P of n >= N points with more than n^(1 + C/log(log n)) unit-distance pairs (Point = EuclideanSpace ℝ (Fin 2); unitDistancePairs P = Erdos.unitDist P, the number of unordered pairs of distinct points of P at Euclidean distance one). The companion declaration Erdos90b.erdos_90b is an alias of the same theorem. The formal core is Erdos.erdos_unit_distance_uniform_constant_false in the ErdosUnitDistance closure; the entry theorem is its immediate restatement (simpa). The supporting formalization is due to Kim Morrison and the Tau Ceti contributors (credited in the pinned source header); the pinned sources target Lean v4.33.0/mathlib v4.33.0 and were ported to the current release v4.34.0 with 8 documented patches (PORTING-DIFF-106.md)."
  definitions_reviewed:
    - name: "Erdos90b.Point"
      from_library: false
      review: "Local abbreviation in ErdosProblems/Erdos90b.lean: Point = EuclideanSpace ℝ (Fin 2), the Euclidean plane. Matches the problem's setting."
    - name: "Erdos90b.unitDistancePairs"
      from_library: false
      review: "Local abbreviation in ErdosProblems/Erdos90b.lean: unitDistancePairs P = Erdos.unitDist P, the number of unordered pairs of distinct points at Euclidean distance one. Exactly the quantity u(n) the problem asks about."
    - name: "Erdos.unitDist"
      from_library: false
      review: "Defined locally in ErdosProblems/Erdos90b/External/ErdosUnitDistance/Counting.lean: for a finite point set P, the cardinality of the collection of 2-element subsets {p,q} of P with p ≠ q and ‖p - q‖ = 1 (unit-distance pairs)."
    - name: "Erdos.erdos_unit_distance_uniform_constant_false"
      from_library: false
      review: "Defined locally in the ErdosUnitDistance closure (Main.lean): the formal core of the result — for every C > 0 and every N, there exist n ≥ N and a configuration P with P.card = n and more than n^(1 + C/log(log n)) unit-distance pairs (Alpöge's construction). The entry theorem not_erdos_90 is its immediate restatement via simpa."
    - name: "EuclideanSpace ℝ (Fin 2)"
      from_library: true
      review: "Mathlib's finite-dimensional Euclidean space; the plane. Distance is the standard Euclidean norm."
    - name: "Real.log"
      from_library: true
      review: "Mathlib's natural logarithm on ℝ; log(log n) is the double logarithm appearing in the problem's exponent."
    - name: "Finset.card"
      from_library: true
      review: "Mathlib's cardinality of a finite set; P.card = n is the number of points."
