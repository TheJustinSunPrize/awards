statement_comparison:
  statement_id: "STMT-jsp-000147-v1"
  theorem_name: "Erdos146.not_erdos_146"
  result: equivalent
  basis: "The informal problem (Erdos problems list, problem 146; candidates/verified-pending/jsp-000147/verification/statement.yaml; https://www.erdosproblems.com/146) asks whether the extremal number of every bipartite graph of bounded degeneracy is at most n^(2-1/r+o(1)) - the Erdos-Simonovits degeneracy conjecture, whose classical special case predicts ex(n,H) = O(n^(2-1/r)) for every bipartite r-degenerate graph H. The formalized theorem not_erdos_146 states exactly the negation: for every r, q and simple graph H on Fin q with 0 < r, H.IsBipartite and IsDegenerate r H, it is NOT the case that ex(n,H) = O(n^(2-1/r)) as n -> infinity (Asymptotics.IsBigO Filter.atTop). The companion theorem twoDegenerateExtremalCounterexample exhibits the counterexample contained in the negation: a connected bipartite 2-degenerate Hamming graph H and constants c, eps > 0 with ex(n,H) >= c * n^(3/2+eps) eventually, strictly above the conjectured O(n^(3/2)). The formal statement directly matches the requested answer (the conjecture is false)."
  performed_by: "jsp147-verifier"
  performed_at: "2026-09-18"
