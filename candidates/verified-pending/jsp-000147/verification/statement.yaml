id: "STMT-jsp-000147-v1"
status: active
supersedes: null
statement:
  text: "Erdos146.not_erdos_146 : ¬ (∀ (r q : ℕ) (H : SimpleGraph (Fin q)), 0 < r → H.IsBipartite → IsDegenerate r H → Asymptotics.IsBigO Filter.atTop (fun n : ℕ => (SimpleGraph.extremalNumber n H : ℝ)) (fun n : ℕ => (n : ℝ) ^ (((2 : ℕ) : ℝ) - 1 / (r : ℝ))))"
  natural_language_source: "How many edges can a graph have while excluding a given bipartite graph of bounded degeneracy? (Erdos problems list, problem 146; problems/catalog-0101-0200.md, entry JSP-000147; https://www.erdosproblems.com/146). The Erdos-Simonovits degeneracy conjecture predicts that every bipartite r-degenerate graph H satisfies ex(n,H) = O(n^(2-1/r)); formally the conjecture quantifies over r, q and H on Fin q with H.IsBipartite and IsDegenerate r H and asserts (SimpleGraph.extremalNumber n H : ℝ) is Asymptotics.IsBigO atTop of n^(2-1/r). The formal statement not_erdos_146 negates this universally quantified bound: the conjecture is false. The companion theorem Erdos146.twoDegenerateExtremalCounterexample proves the explicit counterexample: a connected bipartite 2-degenerate Hamming graph H with constants c, eps > 0 such that c * n^(3/2+eps) <= extremalNumber n H eventually (∀ᶠ n in atTop), strictly above the conjectured O(n^(3/2))."
  definitions_reviewed:
    - name: "SimpleGraph.extremalNumber"
      from_library: true
      review: "Mathlib's Turan number: maximum number of edges in a simple graph on n vertices containing no subgraph isomorphic to H. Exactly the quantity ex(n,H) the problem asks about."
    - name: "SimpleGraph.IsBipartite"
      from_library: true
      review: "Mathlib's bipartiteness predicate (existence of a 2-coloring with no monochromatic edge). Matches the problem's restriction to bipartite graphs."
    - name: "Asymptotics.IsBigO Filter.atTop"
      from_library: true
      review: "Mathlib's Big-O asymptotic comparison; IsBigO atTop f g states |f(n)| <= c*|g(n)| eventually. Formalizes the conjectured O(n^(2-1/r)) upper bound and the negation in not_erdos_146."
    - name: "IsDegenerate"
      from_library: false
      review: "Defined locally in ErdosProblems/Erdos146/ForbiddenGraph.lean: H is r-degenerate iff every nonempty induced subgraph has a vertex of degree at most r (classic degeneracy). Bounded maximum degree implies bounded degeneracy, so this is the correct formalization of the problem's 'bounded degeneracy' hypothesis."
    - name: "IsTwoDegenerate"
      from_library: false
      review: "Defined locally in ErdosProblems/Erdos146/ForbiddenGraph.lean: the 2-degenerate special case used by the counterexample (r = 2)."
    - name: "twoDegenerateExtremalCounterexample"
      from_library: false
      review: "Defined locally in ErdosProblems/Erdos146/MainTheorem.lean: the explicit counterexample contained in the negation - a connected bipartite 2-degenerate graph (Hamming graph over binary strings of length q with a tangent-tuple vertex hardening step) whose extremal number is eventually at least c * n^(3/2+eps), exceeding the conjectured O(n^(3/2)) bound."
