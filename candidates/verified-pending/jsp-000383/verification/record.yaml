  theorem_name: "Jsp383.chain_is_legal_run"
  result: equivalent
  basis: "The informal problem (catalog JSP-000383) asks whether starting from a set of primes, repeatedly adjoining prime sums of three distinct existing primes can generate infinitely many primes. This scoped constructive component exhibits a legal run of 30 such adjoins from the initial set {2,3,5,7,11}, adjoining 19,23,29,...,157 (each a prime sum of three already-present primes), growing the set from 5 to 35 primes. The theorem chain_is_legal_run states exactly that this 30-element chain is distinct, has the right length, and every element is prime — the legal-run property of the closure process, equivalent to the finite growth assertion."
