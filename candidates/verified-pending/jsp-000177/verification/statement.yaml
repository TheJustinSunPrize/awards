id: "STMT-jsp-000177-v1"
status: active
supersedes: null
statement:
  text: "Erdos183.erdos_183 : Filter.Tendsto (fun k => (triangleRamseyNumber k : ℝ) ^ (1 / k)) atTop atTop"
  natural_language_source: "How fast does the number of vertices needed to force a monochromatic triangle grow as the number of edge colors increases? (Erdos problems list, problem 183; problems/catalog-0101-0200.md, entry JSP-000177; https://www.erdosproblems.com/183). Equivalently, for the multicolor triangle Ramsey number R_k(3) (least N such that every k-coloring of the edges of K_N has a monochromatic triangle), the problem asks for the exponential growth rate. The formal statement asserts that the k-th root R_k(3)^(1/k) tends to infinity (Filter.Tendsto ... atTop atTop), i.e., R_k(3) grows faster than every exponential c^k with fixed base c. The companion theorem Erdos183.erdos_problem_183_explicit proves the quantitative lower bound R_k(3) >= ((1 / (6 * exp 38)) * (k ^ (1/3) / log k))^k for all k >= 2."
  definitions_reviewed:
    - name: "triangleRamseyNumber"
      from_library: false
      review: "Defined locally in ErdosProblems/Erdos183/Proof.lean (the multicolor triangle Ramsey number R_k(3): the least N such that every k-coloring of the edges of the complete graph K_N contains a monochromatic triangle). Exactly the quantity the problem asks about."
    - name: "Filter.Tendsto ... atTop atTop"
      from_library: true
      review: "Mathlib's filter-limit notation (Filter.Tendsto f atTop atTop) formalizes 'f(k) -> infinity as k -> infinity' for the sequence (triangleRamseyNumber k : ℝ) ^ (1 / k), capturing the exponential growth rate question."
    - name: "erdos_problem_183_explicit"
      from_library: false
      review: "Defined locally in ErdosProblems/Erdos183/Proof.lean: the explicit quantitative form R_k(3) >= (1/(6*e^38) * k^(1/3) / log k)^k for k >= 2, which implies the divergence of the k-th root."
  library:
    name: "mathlib"
    commit: "5ed2965256430c3649e86755f9576b54eca72435"
    meets_minimum_safe_version: true
