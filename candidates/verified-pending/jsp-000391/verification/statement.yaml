statement:
  text: "Jsp391.d_mem_zero_one : forall n, 2 <= n -> d n = 0 or d n = 1, where d n = u (2*n+1) - 2*(u (2*n-1)) and u is the Graham-Pollak sequence (u 1 = 1, u (n+1) = step (u n), step u = Nat.sqrt (2u(u+1)))."
  natural_language_source: "Floor recurrence generating digits of an algebraic number (Graham-Pollak) (catalog 000391; [GrPo70] Note on a nonlinear recurrence related to sqrt 2 (1970); [St05] J. Integer Seq. 2005)"
  definitions_reviewed:
