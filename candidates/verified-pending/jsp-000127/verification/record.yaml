  note_en: "Independent verification of the pinned upstream commit at Lean v4.34.0 / mathlib v4.34.0. The pinned file (byte-exact from plby/lean-proofs @ 1268917de) compiles exit=0 on the current-release toolchain (direct lean.exe; mathlib source-built, no prebuilt artifacts) after 2 documented porting fixes required by the mathlib 4.33->4.34 API drift (see PORTING-DIFF-127.md and the byte-level pinned-vs-verified diff between hashes-pinned-src.tsv and hashes-final.tsv): (1) Finset.prod_le_prod -> Finset.prod_le_prod₀ (mathlib 4.34 made prod_le_prod the single-hypothesis [MulLeftMono] variant; the two-hypothesis ordered-ring form is prod_le_prod₀), (2) dropped the obsolete 'have hsub : m + 3 - 2 = m + 1 := by omega; rw [hsub]' in cube_le_six_choose (4.34's norm_num [Nat.descFactorial_succ] already normalizes (m+3).descFactorial 3 to (m+1)*((m+2)*(m+3)); the rewrite had no pattern left). Driver run 2026-09-19 03:26:24 -> 03:26:50: Erdos119 exit=0 (17 s), Audit127 exit=0 (9 s), ALL DONE 03:26:50 (log embedded in current-release-v4.34.log, which also records the first-pass porting error at 03:22:54, the sorryAx recovery-stub artifact of that error, and one externally terminated recompile at 03:32:14 that wrote no output). lean --deps exit=0 for both modules (Erdos119: Init + Mathlib; Audit127: Init + ErdosProblems.Erdos119). Zero-sorry scan over the 1788-line source: 0 occurrences of sorry/admit. Axiom audit via #print axioms on all four exported declarations (Audit127.lean) reports exactly [propext, Classical.choice, Quot.sound]; no sorryAx, no user axioms, no unsafe declarations. Module layout mirrors upstream (ErdosProblems.Erdos119)."
