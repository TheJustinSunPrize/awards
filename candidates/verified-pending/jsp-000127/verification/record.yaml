statement_comparison:
  statement_id: "STMT-jsp-000127-v1"
  theorem_name: "Erdos119.erdos_119"
  result: equivalent
  basis: "The informal problem (Erdos problems list, problem 119; candidates/verified-pending/jsp-000127/verification/statement.yaml; https://www.erdosproblems.com/119) asks how the maximum modulus of a polynomial whose zeros all lie on the unit circle grows with its degree. The problem page records: the weaker conjecture limsup M_n = ∞ was proved by Wagner [Wa80]; Beck [Be91] proved there is c > 0 with max_{n ≤ N} M_n > N^c; Erdos gave a construction with M_n ≤ n+1 and Linden [Li77] improved it to M_n ≪ n^{1-c}; the $100 prize was offered for the third question (growth rate) in [Er97f] and, per the problem page, was resolved by GPT 5.6 and Korsky (proof claims) with the rate ∑_{k ≤ n} M_k ≫ n^{3/2-o(1)}. The formalized theorem erdos_119 answers the growth question affirmatively with explicit constants: for every sequence z : ℕ → ℂ with ‖z i‖ = 1 (all zeros on the unit circle), there is an absolute constant c > 0 (c = 1/256 in the proof) such that eventually in n the running sum ∑_{k < n} M z k of the maximum moduli M z k = sSup {‖∏_{i < k}(w - z i)‖ | ‖w‖ = 1} exceeds n^(1 + c). The companion declarations give the quantitative growth (eventually C · n^(5/4)/√(log n) < ∑_{k < n} M z k, a near-n^(5/4) aggregate rate), infinitely many n with M z n > n^c (refining Beck's theorem), and limsup_n (M z n) = ∞ (matching Wagner's theorem). The formal statements are exactly the statements of the pinned file: an affirmative answer to the prize question with explicit constants and a quantitative corollary at the near-n^(5/4) aggregate rate — consistent with the page's claimed n^(3/2-o(1)) rate (weaker, not reproducing the full claimed exponent); we verify the Lean file as pinned, not the page's headline claim."
  performed_by: "jsp127-verifier"
  performed_at: "2026-09-19"
