attribution:
  proof_route: "Strong induction on the number of vertices following Rademacher (1962): handshake-lemma degree arguments to peel a low-degree vertex, Mantel's theorem (via mathlib's Turán machinery) for base cases and the no-triangle subcase, edge deletion for the even-order subcase, and the sum-of-degree-excess pigeonhole for the minimum-degree case. The informal write-up (PROOF.md in the repository) was assembled from public lecture materials with all numerical identities re-derived and three gaps in a widely circulated transcription repaired."
