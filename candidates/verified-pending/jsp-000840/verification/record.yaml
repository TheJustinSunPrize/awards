  basis: "The candidate statement (STMT-jsp-000840-v1) is the l = 1 case of the catalogued problem: every graph on n ≥ 3 vertices with at least n²/4 + 1 edges contains at least n/2 triangles (floors in natural division). The Lean theorem Rad.rademacher states exactly this, with hypotheses h3 : 3 ≤ Fintype.card V and he : Fintype.card V ^ 2 / 4 + 1 ≤ G.edgeFinset.card and conclusion Fintype.card V / 2 ≤ (G.cliqueFinset 3).card; edge counting is via mathlib's edgeFinset and triangle counting via cliqueFinset 3. Quantifier structure and all premises match clause by clause. The general l case recorded in the entry (Khadzhiivanov-Nikiforov) is NOT covered by this theorem; see citation.md for the scope statement."
