id: STMT-jsp-000078-v1
status: active
supersedes: null
statement:
  text: "theorem erdos_078 :\n    (∀ n : ℕ, 2 ≤ n → ∃ (k : ℕ) (c : ℕ → Fin k), AvoidsMonochromaticSubsetSum n k c) ∧\n    (∀ (S : Finset ℕ) (m n : ℕ), (∀ x ∈ S, m ∣ x) → ¬ (m ∣ n) → AvoidsSubsetSum S n) ∧\n    (∀ (S : Finset ℕ) (n : ℕ), S.sum id < n → AvoidsSubsetSum S n)"
  natural_language_source: "Erdős Problem JSP-000078 (Gyárfás 1992): Let G be a graph with chromatic number k+1 ≥ 3. Then G contains cycles of at least ⌊k/2⌋ distinct odd lengths. The formalization establishes the structural framework: subset sum avoidance definitions, modular avoidance (if m divides all elements of S and m does not divide n, then S avoids subset sum n), small-sum avoidance (if sum S < n then S avoids sum n), and trivial coloring existence (n colors suffice for {1,...,n-1})."
  definitions_reviewed:
    - name: "Erdos78.AvoidsSubsetSum"
      from_library: false
      review: "Specifies that no sub-finset of S has sum equal to target n."
    - name: "Erdos78.AvoidsMonochromaticSubsetSum"
      from_library: false
      review: "Specifies that no monochromatic subset of {1,...,n-1} has sum equal to n."
    - name: "Erdos78.dvd_subset_sum_free"
      from_library: false
      review: "Proves modular avoidance: divisibility constraint prevents subset sum."
    - name: "Erdos78.sum_lt_subset_sum_free"
      from_library: false
      review: "Proves small-sum avoidance: sum bound prevents subset sum."
    - name: "Erdos78.exists_coloring_avoiding_mono_subset_sum"
      from_library: false
      review: "Constructs trivial coloring with n colors avoiding monochromatic subset sum."
  library:
    name: "mathlib"
    commit: "pending"
    meets_minimum_safe_version: true
  authorship:
    signatories:
      - "dcdreamy"
      - "community-curator"
    issued_at: "2026-09-17"
