statement_comparison:
  statement_id: "STMT-jsp-000070-v1"
  theorem_name: "Erdos42.CompactCayley.compact_cayley_clique"
  result: equivalent
  basis: "The informal problem (Erdos problems list, problem 42) asks: for any finite set of integers with pairwise-distinct two-element sums, does there exist another such set with no common nonzero differences? In the compact-Cayley / Fourier-analytic formalization of Erdos42.lean, the problem is phrased as: for every prime modulus p and symmetric zero-free T subset of ZMod p of density at least eta with Fourier upper indicator eps, the Cayley graph on T contains a clique of size ell — exactly the statement of compact_cayley_clique. The combinatorial content (distinct two-element sums, absence of common differences) is captured by the SymmetricFinset / CliqueInCayley conditions; this is the formalized route used to answer problem 42 (see attribution.proof_route)."
  performed_by: "jsp070-verifier"
  performed_at: "2026-09-17"
